[project]
name = "pcr"
version = "1.0.0"
description = "La formule de capital du BSIF suppose une infinité de prêts : de combien se trompe-t-elle sur un portefeuille fini, et l'ajustement de granularité la répare-t-il ?"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Guillaume Vaudescal" }]
dependencies = [
    "gvf[figures]>=0.2.1",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "truststore>=0.9",
    "typer>=0.12",
]

[project.scripts]
pcr = "pcr.cli:app"

[project.urls]
Homepage = "https://github.com/Guilou001/27-portefeuille-de-credit"

[tool.uv.sources]
gvf = { git = "https://github.com/Guilou001/gv-fintools", tag = "v0.2.1" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcr"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
